name: Update SDE

on:
  schedule:
    # EVE-downtime is 11:00 UTC; CCP brengt nieuwe SDE/patches tijdens die downtime uit.
    # 12:00 UTC = 1u buffer erna → een nieuwe SDE staat dezelfde dag live.
    - cron: '0 12 * * *'   # elke dag 12:00 UTC (na EVE-downtime)
  workflow_dispatch: {}     # handmatig te starten

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FTP_TIMEOUT_MS: 120000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Genereer SDE-bundles uit de nieuwste SDE
        run: python tools/build-sde.py

      - name: Is er iets gewijzigd?
        id: diff
        run: |
          if [ -n "$(git status --porcelain public/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Geen SDE-wijziging — niets te doen."
          fi

      - name: Commit bundels
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/*.json
          git commit -m "chore: SDE-bundels automatisch bijgewerkt"
          git push

      # Zelf bouwen + deployen (de auto-commit triggert de gewone deploy-workflow niet)
      - uses: actions/setup-node@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
        if: steps.diff.outputs.changed == 'true'

      - run: npx vite build
        if: steps.diff.outputs.changed == 'true'
        env:
          VITE_EVE_CLIENT_ID: ${{ secrets.VITE_EVE_CLIENT_ID }}
          VITE_EVE_REDIRECT_URI: ${{ secrets.VITE_EVE_REDIRECT_URI }}

      - name: Upload via FTP
        if: steps.diff.outputs.changed == 'true'
        uses: ./.github/actions/ftp-deploy-retry
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          timeout-ms: ${{ env.FTP_TIMEOUT_MS }}

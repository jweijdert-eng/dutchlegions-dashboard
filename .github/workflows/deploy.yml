name: Build & Deploy

on:
  push:
    branches: [main]
  # Ook met de hand te starten. Nodig gebleken tijdens de Actions-storing van
  # 6 augustus 2026: pushes kwamen wel aan, maar er werd geen run aangemaakt.
  # Zonder deze regel is de enige uitweg een lege commit pushen.
  workflow_dispatch: {}

# Serialiseer deploys: nooit twee FTP-uploads tegelijk (voorkomt race-fouten en
# een terugdraaiende index.html). Niet annuleren — laat een lopende upload afmaken.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_TIMEOUT_MS: 120000
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - run: npx vite build
        env:
          VITE_EVE_CLIENT_ID: ${{ secrets.VITE_EVE_CLIENT_ID }}
          VITE_EVE_REDIRECT_URI: ${{ secrets.VITE_EVE_REDIRECT_URI }}

      - name: Upload via FTP
        uses: ./.github/actions/ftp-deploy-retry
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          timeout-ms: ${{ env.FTP_TIMEOUT_MS }}

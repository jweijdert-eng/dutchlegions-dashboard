name: Retry FTP deploy
description: Retry the FTP deploy action once before failing

inputs:
  server:
    description: FTP server
    required: true
  username:
    description: FTP username
    required: true
  password:
    description: FTP password
    required: true
  local-dir:
    description: Directory to upload
    required: false
    default: ./dist/
  server-dir:
    description: Remote directory to upload into
    required: false
    default: /public_html/
  protocol:
    description: FTP protocol (ftps = versleuteld)
    required: false
    default: ftps
  port:
    description: FTP port
    required: false
    default: "21"
  security:
    description: strict = certificaat van de server controleren
    required: false
    default: strict
  dangerous-clean-slate:
    description: Whether to wipe the remote directory before upload
    required: false
    default: "false"
  timeout-ms:
    description: FTP action timeout in milliseconds
    required: false
    default: "120000"

runs:
  using: composite
  steps:
    # De host stuurt geen tussencertificaat mee; zonder deze bundel faalt de strenge
    # certificaatcontrole. Vernieuwen: bash vernieuw-ca.sh in deze map.
    - name: Tussencertificaten voor FTPS
      shell: bash
      run: echo "NODE_EXTRA_CA_CERTS=${{ github.action_path }}/ftps-ca.pem" >> "$GITHUB_ENV"

    - name: Upload via FTP
      id: upload_1
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ inputs.server }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        local-dir: ${{ inputs.local-dir }}
        server-dir: ${{ inputs.server-dir }}
        protocol: ${{ inputs.protocol }}
        security: ${{ inputs.security }}
        port: ${{ inputs.port }}
        dangerous-clean-slate: ${{ inputs.dangerous-clean-slate }}
        timeout: ${{ inputs.timeout-ms }}

    - name: Wachten voor poging 2
      if: steps.upload_1.outcome == 'failure'
      shell: bash
      run: sleep 15

    - name: Retry FTP upload (poging 2)
      id: upload_2
      if: steps.upload_1.outcome == 'failure'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ inputs.server }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        local-dir: ${{ inputs.local-dir }}
        server-dir: ${{ inputs.server-dir }}
        protocol: ${{ inputs.protocol }}
        security: ${{ inputs.security }}
        port: ${{ inputs.port }}
        dangerous-clean-slate: ${{ inputs.dangerous-clean-slate }}
        timeout: ${{ inputs.timeout-ms }}

    - name: Wachten voor poging 3
      if: steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure'
      shell: bash
      run: sleep 30

    - name: Retry FTP upload (poging 3)
      id: upload_3
      if: steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure'
      continue-on-error: true
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ inputs.server }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
        local-dir: ${{ inputs.local-dir }}
        server-dir: ${{ inputs.server-dir }}
        protocol: ${{ inputs.protocol }}
        security: ${{ inputs.security }}
        port: ${{ inputs.port }}
        dangerous-clean-slate: ${{ inputs.dangerous-clean-slate }}
        timeout: ${{ inputs.timeout-ms }}

    - name: Fail als FTP na 3 pogingen blijft falen
      if: steps.upload_1.outcome == 'failure' && steps.upload_2.outcome == 'failure' && steps.upload_3.outcome == 'failure'
      shell: bash
      run: |
        echo "FTP upload mislukt na 3 pogingen (poging 1, 2 én 3)."
        exit 1

<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dutch Legions — Recruiting</title>
  <style>
    :root { --bg:#05050e; --surface:#0f0f22; --surface2:#13132b; --border:#1c1c35; --text:#e1e4f0; --text-dim:#8a90b0; --blue:#00b4d8; --gold:#f0c040; --green:#3ecf6e; --red:#e05555; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:
        radial-gradient(120% 120% at 20% 0%, rgba(0,180,216,0.10), transparent 55%),
        radial-gradient(100% 120% at 90% 100%, rgba(240,192,64,0.06), transparent 55%), var(--bg);
      color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; }
    a { color:var(--blue); }
    .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; margin:2rem auto; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* Login — zelfde achtergrond als het dashboard (bg.png + vignette) */
    .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; position:relative; overflow:hidden; background:var(--bg); }
    .center::before { content:''; position:absolute; inset:0; background-image:url(https://dutchlegionsdashboard.eu/bg.png); background-size:cover; background-position:center; filter:brightness(.55) saturate(1.1); z-index:0; }
    .center::after { content:''; position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 40%, rgba(5,5,14,.7) 100%); z-index:1; }
    .card { position:relative; z-index:2; background:linear-gradient(160deg, rgba(11,11,26,.92) 0%, rgba(5,5,14,.96) 100%); border:1px solid rgba(0,180,216,.2); border-radius:6px; box-shadow:0 8px 60px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05); backdrop-filter:blur(12px); padding:2.5rem 2.25rem; max-width:420px; width:100%; text-align:center; }
    .card h1 { font-size:1.4rem; margin:0 0 .3rem; } .card h1 span { color:var(--blue); }
    .card .sub { color:var(--text-dim); font-size:.85rem; margin-bottom:1.75rem; line-height:1.6; }
    .login-btn { background:none; border:none; cursor:pointer; padding:0; transition:filter .15s, transform .15s; }
    .login-btn:hover { filter:brightness(1.15); transform:translateY(-1px); }
    .err { color:var(--red); font-size:.8rem; margin-top:1rem; }
    .foot { margin-top:1.5rem; font-size:.62rem; color:var(--text-dim); }

    /* Dashboard-shell */
    .shell { display:flex; min-height:100vh; }
    .side { width:230px; flex-shrink:0; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; }
    .side-h { padding:1rem; border-bottom:1px solid var(--border); }
    .side-h .pf { width:64px; height:64px; border-radius:50%; border:2px solid var(--blue); box-shadow:0 0 14px rgba(0,180,216,.35); display:block; margin-bottom:.5rem; }
    .side-h .nm { font-weight:700; font-size:.95rem; }
    .side-h .org { font-size:.62rem; color:var(--text-dim); margin-top:.2rem; display:flex; align-items:center; gap:.3rem; flex-wrap:wrap; }
    .side-h .org img { width:16px; height:16px; border-radius:2px; }
    nav { flex:1; padding:.4rem 0; overflow-y:auto; }
    .ni { display:flex; align-items:center; gap:.6rem; padding:.55rem 1rem; cursor:pointer; color:var(--text-dim); font-size:.78rem; border-left:2px solid transparent; user-select:none; }
    .ni:hover { background:rgba(255,255,255,.03); }
    .ni.on { color:var(--blue); background:rgba(0,180,216,.07); border-left-color:var(--blue); }
    .ni .ic { width:18px; text-align:center; }
    .ni .ct { margin-left:auto; font-size:.6rem; color:var(--text-dim); background:rgba(255,255,255,.06); border-radius:9px; padding:0 6px; }
    .side-f { padding:.7rem 1rem; border-top:1px solid var(--border); display:flex; gap:.4rem; flex-wrap:wrap; }
    .main { flex:1; min-width:0; overflow-y:auto; padding:1.25rem 1.5rem; max-height:100vh; }
    .main h2 { font-size:1rem; margin:0 0 1rem; letter-spacing:.03em; }

    .btn { background:transparent; border:1px solid var(--border); color:var(--text-dim); border-radius:5px; font-size:.72rem; font-weight:600; padding:.4rem .8rem; cursor:pointer; }
    .btn:hover { border-color:var(--blue); color:var(--blue); }
    .abtn { border:none; border-radius:5px; font-size:.72rem; font-weight:600; padding:.4rem .8rem; cursor:pointer; }

    .psec { background:rgba(0,0,0,.2); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
    .prow { display:flex; justify-content:space-between; gap:.6rem; padding:.45rem .8rem; border-bottom:1px solid rgba(255,255,255,.05); font-size:.76rem; align-items:center; }
    .prow:last-child { border-bottom:none; }
    .plabel { color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pval { font-weight:700; text-align:right; white-space:nowrap; }
    .empty { color:var(--text-dim); font-size:.8rem; padding:1rem 0; }
    .sgrp { background:rgba(0,0,0,.2); border:1px solid var(--border); border-radius:6px; margin-bottom:.4rem; overflow:hidden; }
    .sgrp > summary { display:flex; justify-content:space-between; gap:.6rem; align-items:center; cursor:pointer; padding:.5rem .8rem; font-size:.78rem; list-style:none; user-select:none; }
    .sgrp > summary::-webkit-details-marker { display:none; }
    .sgrp > summary::before { content:'▸'; color:var(--text-dim); margin-right:.4rem; transition:transform .15s; display:inline-block; }
    .sgrp[open] > summary::before { transform:rotate(90deg); }
    .sgrp > summary:hover { background:rgba(255,255,255,.04); }
    .sgname { font-weight:700; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .sgmeta { color:var(--text-dim); white-space:nowrap; font-size:.72rem; }
    .sgrp .psec { background:transparent; border:none; border-top:1px solid var(--border); border-radius:0; }
    .vflag { border:1px solid var(--border); border-left-width:3px; border-radius:6px; padding:.6rem .8rem; margin-bottom:.45rem; font-size:.8rem; line-height:1.4; }
    .vflag.v-bad { border-left-color:var(--red); background:rgba(224,85,85,.08); color:#ffb4b4; }
    .vflag.v-warn { border-left-color:var(--gold); background:rgba(240,192,64,.08); color:#ffe08a; }
    .vflag.v-ok { border-left-color:var(--green); background:rgba(62,207,110,.08); color:#9be8b8; }
    .vflag.v-info { border-left-color:var(--text-dim); background:rgba(255,255,255,.03); color:var(--text-dim); }
    .verdict { font-size:1.1rem; font-weight:800; letter-spacing:.08em; text-align:center; padding:.7rem; border-radius:8px; margin-bottom:.8rem; border:1px solid; }
    .verdict.v-bad { color:#ffb4b4; background:rgba(224,85,85,.14); border-color:var(--red); }
    .verdict.v-warn { color:#ffe08a; background:rgba(240,192,64,.14); border-color:var(--gold); }
    .verdict.v-ok { color:#9be8b8; background:rgba(62,207,110,.14); border-color:var(--green); }
    .mail { border:1px solid var(--border); border-radius:6px; margin-bottom:.35rem; overflow:hidden; }
    .mailhdr { padding:.45rem .7rem; cursor:pointer; display:flex; gap:.5rem; align-items:center; font-size:.74rem; background:rgba(255,255,255,.03); }
    .mailbody { display:none; padding:.6rem .7rem; font-size:.72rem; white-space:pre-wrap; word-break:break-word; border-top:1px solid var(--border); max-height:300px; overflow-y:auto; }
    .badge { font-size:.55rem; font-weight:700; padding:.1rem .4rem; border-radius:10px; letter-spacing:.05em; }
    .b-new { background:rgba(0,180,216,.15); color:var(--blue); } .b-accepted { background:rgba(62,207,110,.15); color:var(--green); } .b-rejected { background:rgba(224,85,85,.15); color:var(--red); }

    /* Admin-lijst */
    .ahead { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.1rem; }
    .ahead h1 { margin:0; font-size:1.3rem; } .ahead h1 span { color:var(--blue); }
    .rgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:.75rem; }
    .rcard { display:flex; gap:.7rem; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.7rem .8rem; cursor:pointer; transition:border-color .15s, transform .1s; }
    .rcard:hover { border-color:var(--blue); transform:translateY(-1px); }
    .rcard img.p { width:52px; height:52px; border-radius:50%; border:1px solid var(--border); flex-shrink:0; }
    .rname { font-weight:700; font-size:.85rem; }
    .rmeta { font-size:.62rem; color:var(--text-dim); margin-top:.1rem; display:flex; align-items:center; gap:.3rem; flex-wrap:wrap; }
    .rmeta img { width:16px; height:16px; border-radius:2px; }
    .rstats { font-size:.62rem; color:var(--text-dim); margin-top:.2rem; }
    /* Admin toolbar / stats / verdict */
    .astats { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:.9rem; }
    .stat { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:.5rem .85rem; min-width:78px; cursor:pointer; transition:border-color .15s; }
    .stat:hover { border-color:var(--blue); }
    .stat.on { border-color:var(--blue); background:rgba(0,180,216,.08); }
    .stat .n { font-size:1.25rem; font-weight:800; line-height:1; }
    .stat .l { font-size:.58rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:.25rem; }
    .atools { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin-bottom:.9rem; }
    .atools input, .atools select { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:.45rem .6rem; font-size:.74rem; font-family:inherit; }
    .atools input { flex:1; min-width:160px; }
    .atools input:focus, .atools select:focus { outline:none; border-color:var(--blue); }
    .rcard { position:relative; }
    .rcard .vdot { position:absolute; top:.55rem; right:.6rem; width:9px; height:9px; border-radius:50%; }
    .vdot.v-bad { background:var(--red); box-shadow:0 0 6px var(--red); } .vdot.v-warn { background:var(--gold); } .vdot.v-ok { background:var(--green); }
    .racts { display:flex; gap:.3rem; margin-top:.4rem; }
    .racts button { border:1px solid var(--border); background:transparent; border-radius:5px; font-size:.62rem; font-weight:600; padding:.2rem .5rem; cursor:pointer; color:var(--text-dim); }
    .racts button:hover { border-color:currentColor; }
    .racts .a-acc:hover { color:var(--green); } .racts .a-rej:hover { color:var(--red); } .racts .a-del:hover { color:var(--red); }
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:100; }
    .modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.2rem; width:min(460px,92vw); max-height:84vh; overflow:auto; }
    .modal h3 { margin:0 0 .9rem; font-size:1.05rem; }
    .arow { display:flex; gap:.5rem; align-items:center; justify-content:space-between; padding:.45rem .1rem; border-bottom:1px solid rgba(255,255,255,.05); font-size:.8rem; }
    .arow:last-child { border-bottom:none; } .arow img { width:24px; height:24px; border-radius:50%; vertical-align:middle; margin-right:.45rem; }
    @media (max-width:640px) { .side { width:64px; } .side-h .nm,.side-h .org,.ni .lbl,.ni .ct { display:none; } }
  </style>
</head>
<body>
  <div id="root"><div class="spinner"></div></div>

  <script>
    const CLIENT_ID    = 'ea612f44ca444a50bb205e27d2fa3ead';
    const REDIRECT_URI = 'https://recruiting.dutchlegionsdashboard.eu';
    const SCOPES = [
      'publicData','esi-wallet.read_character_wallet.v1','esi-mail.read_mail.v1',
      'esi-characters.read_standings.v1','esi-characters.read_contacts.v1','esi-skills.read_skills.v1',
      'esi-corporations.read_contacts.v1','esi-alliances.read_contacts.v1',
      'esi-location.read_location.v1','esi-location.read_ship_type.v1','esi-assets.read_assets.v1',
      'esi-clones.read_clones.v1','esi-contracts.read_character_contracts.v1',
    ].join(' ');
    const STORE_KEY = 'recruit_token';
    const ESI = 'https://esi.evetech.net/latest';
    const API = 'https://dutchlegionsdashboard.eu/api';
    const ADMIN_CHAR_ID = 1831618559;
    const root = document.getElementById('root');

    // ── Helpers ─────────────────────────────────────────────────────────────────
    const b64url = b => btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    async function pkce() { const v=b64url(crypto.getRandomValues(new Uint8Array(32))); const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)); return {verifier:v,challenge:b64url(new Uint8Array(h))}; }
    function fmtISK(v){ const a=Math.abs(v),n=v<0?'-':''; if(a>=1e12)return n+(a/1e12).toFixed(2)+'T'; if(a>=1e9)return n+(a/1e9).toFixed(2)+'B'; if(a>=1e6)return n+(a/1e6).toFixed(1)+'M'; if(a>=1e3)return n+(a/1e3).toFixed(0)+'K'; return n+a.toFixed(0); }
    function fmtSP(v){ return v>=1e6?(v/1e6).toFixed(1)+'M':v>=1e3?(v/1e3).toFixed(0)+'K':String(v); }
    function secColor(s){ return s>=0.5?'#3ecf6e':s>0?'#f0c040':'#e05555'; }
    function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function stripHtml(h){ return (h||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/p>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&nbsp;/g,' ').trim(); }
    async function esi(p,tok){ const r=await fetch(ESI+p+(p.includes('?')?'&':'?')+'datasource=tranquility', tok?{headers:{Authorization:'Bearer '+tok}}:undefined); if(!r.ok) throw new Error(p+' '+r.status); return r.json(); }
    async function resolveNames(ids){ const out=new Map(); const u=[...new Set(ids.filter(Boolean))]; if(!u.length)return out; try{ const r=await fetch(ESI+'/universe/names/?datasource=tranquility',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(u)}); if(r.ok) for(const x of await r.json()) out.set(x.id,x.name); }catch{} return out; }
    // character-naam → {id,name} (voor recruiter toevoegen)
    async function charIdByName(name){ try{ const r=await fetch(ESI+'/universe/ids/?datasource=tranquility',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify([name])}); if(r.ok){ const j=await r.json(); const c=(j.characters||[])[0]; return c?{id:c.id,name:c.name}:null; } }catch{} return null; }
    // character-id → huidige corp/alliance (voor mail-vetting)
    async function resolveAffiliations(ids){ const out=new Map(); const u=[...new Set(ids.filter(Boolean))]; if(!u.length)return out; try{ const r=await fetch(ESI+'/characters/affiliation/?datasource=tranquility',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(u)}); if(r.ok) for(const x of await r.json()) out.set(x.character_id,{corp:x.corporation_id,alliance:x.alliance_id||null}); }catch{} return out; }
    const dt = s => s ? new Date(s).toLocaleDateString('nl-NL',{day:'2-digit',month:'short',year:'2-digit'}) : '';
    // concurrency-gelimiteerde map (om ESI niet plat te leggen)
    async function mapLimit(arr,limit,fn){ let i=0; const workers=Array.from({length:Math.min(limit,arr.length||1)},async()=>{ while(i<arr.length){ const idx=i++; await fn(arr[idx]); } }); await Promise.all(workers); }
    // Deel skills in per EVE-skillgroep (Gunnery, Spaceship Command, …) met SP-subtotaal.
    async function groupSkills(allSkills,names){
      if(!allSkills.length) return [];
      const tc=(()=>{ try{return JSON.parse(localStorage.getItem('rec_typegrp')||'{}');}catch{return{};} })();
      const uniq=[...new Set(allSkills.map(s=>s.skill_id))].filter(t=>tc[t]==null);
      await mapLimit(uniq,8,async tid=>{ try{const t=await esi('/universe/types/'+tid+'/'); tc[tid]=t.group_id||0;}catch{tc[tid]=0;} });
      try{ localStorage.setItem('rec_typegrp',JSON.stringify(tc)); }catch{}
      const grpIds=[...new Set(allSkills.map(s=>tc[s.skill_id]).filter(Boolean))];
      const gn={}; await mapLimit(grpIds,8,async gid=>{ try{const g=await esi('/universe/groups/'+gid+'/'); gn[gid]=g.name;}catch{gn[gid]='Groep '+gid;} });
      const byGrp=new Map();
      for(const s of allSkills){ const gid=tc[s.skill_id]||0; const name=gn[gid]||'Overig'; if(!byGrp.has(name))byGrp.set(name,{name,totalSp:0,count:0,skills:[]}); const g=byGrp.get(name); g.totalSp+=s.skillpoints_in_skill; g.count++; g.skills.push({name:names.get(s.skill_id)||('Skill '+s.skill_id),level:s.trained_skill_level,sp:s.skillpoints_in_skill}); }
      return [...byGrp.values()].sort((a,b)=>b.totalSp-a.totalSp).map(g=>({name:g.name,totalSp:g.totalSp,count:g.count,skills:g.skills.sort((a,b)=>b.sp-a.sp)}));
    }

    // ── OAuth ─────────────────────────────────────────────────────────────────
    async function startLogin(){ const {verifier,challenge}=await pkce(); const state=b64url(crypto.getRandomValues(new Uint8Array(16))); sessionStorage.setItem('pkce_verifier',verifier); sessionStorage.setItem('oauth_state',state);
      location.href='https://login.eveonline.com/v2/oauth/authorize?'+new URLSearchParams({response_type:'code',client_id:CLIENT_ID,redirect_uri:REDIRECT_URI,scope:SCOPES,state,code_challenge:challenge,code_challenge_method:'S256'}); }
    async function exchange(code,state){ if(state!==sessionStorage.getItem('oauth_state'))throw new Error('State mismatch'); const v=sessionStorage.getItem('pkce_verifier'); if(!v)throw new Error('Geen verifier'); sessionStorage.removeItem('oauth_state'); sessionStorage.removeItem('pkce_verifier');
      const r=await fetch('https://login.eveonline.com/v2/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code,client_id:CLIENT_ID,code_verifier:v})});
      if(!r.ok)throw new Error('Token-uitwisseling mislukt ('+r.status+')'); const d=await r.json(); const p=JSON.parse(atob(d.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); const sub=String(p.sub); const cid=parseInt(sub.includes(':')?sub.split(':').pop():sub,10);
      return {accessToken:d.access_token,refreshToken:d.refresh_token,expiresAt:Date.now()+d.expires_in*1000,characterId:cid,characterName:p.name}; }

    // ── Login-scherm ────────────────────────────────────────────────────────────
    function renderLogin(err){
      root.innerHTML='<div class="center"><div class="card">'+
        '<h1>Dutch Legions <span>Recruiting</span></h1>'+
        '<div class="sub">Log in met je EVE Online-character om je aanmelding te starten.</div>'+
        '<button class="login-btn" id="login"><img src="https://web.ccpgamescdn.com/eveonlineassets/developers/eve-sso-login-black-large.png" alt="LOG IN with EVE Online" width="270" /></button>'+
        (err?'<div class="err">'+esc(err)+'</div>':'')+
        '<div class="foot">Beveiligd via EVE Online SSO · Dutch Legions</div></div></div>';
      document.getElementById('login').onclick=startLogin;
    }

    // Skills die wijzen op cyno/hotdrop/spy-profielen — voor vetting
    const RISK_SKILL_PATTERNS = [
      {re:/cyno/i, label:'Cyno'},
      {re:/black ops/i, label:'Black Ops'},
      {re:/covert ops/i, label:'Covert Ops'},
      {re:/recon ships/i, label:'Recon'},
      {re:/jump (drive|portal)/i, label:'Jump Drive'},
    ];
    const riskLabel = name => (RISK_SKILL_PATTERNS.find(p=>p.re.test(name))||{}).label || null;

    // Verdachte termen / externe comms in mailinhoud — voor vetting
    const SUSPECT_TERMS = [
      {re:/\bspy(ing|s)?\b/i, label:'spy'},
      {re:/\bawox/i, label:'awox'},
      {re:/\bintel\b/i, label:'intel'},
      {re:/\bmole\b/i, label:'mole'},
      {re:/infiltrat/i, label:'infiltrate'},
      {re:/hot[- ]?drop/i, label:'hotdrop'},
      {re:/honeypot/i, label:'honeypot'},
      {re:/cyno\s*alt/i, label:'cyno alt'},
      {re:/\btitan\b/i, label:'titan'},
      {re:/supercarrier|\bsupers?\b/i, label:'supers'},
      {re:/discord(\.gg|app\.com)?/i, label:'Discord'},
      {re:/teamspeak|ts3(\.|server)?/i, label:'TeamSpeak'},
      {re:/mumble/i, label:'Mumble'},
    ];
    const URL_RE = /https?:\/\/[^\s"'<>]+/ig;
    function scanText(txt){ const out=new Set(); for(const p of SUSPECT_TERMS){ if(p.re.test(txt)) out.add(p.label); } if((txt||'').match(URL_RE)) out.add('externe link'); return [...out]; }

    // ── Data verzamelen (recruit) ─────────────────────────────────────────────
    async function gatherData(t){
      const id=t.characterId, tok=t.accessToken;
      const [info,wallet,mail,standings,skills,loc,ship,assets,journal,contracts]=await Promise.all([
        esi('/characters/'+id+'/').catch(()=>null),
        esi('/characters/'+id+'/wallet/',tok).catch(()=>null),
        esi('/characters/'+id+'/mail/',tok).catch(()=>null),
        esi('/characters/'+id+'/standings/',tok).catch(()=>null),
        esi('/characters/'+id+'/skills/',tok).catch(()=>null),
        esi('/characters/'+id+'/location/',tok).catch(()=>null),
        esi('/characters/'+id+'/ship/',tok).catch(()=>null),
        esi('/characters/'+id+'/assets/',tok).catch(()=>null),
        esi('/characters/'+id+'/wallet/journal/',tok).catch(()=>null),
        esi('/characters/'+id+'/contracts/',tok).catch(()=>null),
      ]);
      const allSkills=(skills?.skills||[]).slice().sort((a,b)=>b.skillpoints_in_skill-a.skillpoints_in_skill);
      // Persoonlijke contacts (eigen contactlijst met standings)
      const pcontacts=await esi('/characters/'+id+'/contacts/',tok).catch(()=>null);
      const topContacts=(Array.isArray(pcontacts)?pcontacts:[]).slice().sort((a,b)=>b.standing-a.standing).slice(0,100);
      // Werkgevershistorie (publiek) + de alliance van elke corp (voor vetting)
      const hist=await esi('/characters/'+id+'/corporationhistory/').catch(()=>null);
      const histArr=Array.isArray(hist)?hist:[];
      const histCorps=[...new Set(histArr.map(h=>h.corporation_id))];
      const corpInfo={}; await mapLimit(histCorps,8,async cid=>{ try{const c=await esi('/corporations/'+cid+'/'); corpInfo[cid]={alliance:c.alliance_id||null,name:c.name};}catch{corpInfo[cid]={alliance:null,name:null};} });
      const ids=[]; if(info){ if(info.corporation_id)ids.push(info.corporation_id); if(info.alliance_id)ids.push(info.alliance_id);} if(ship)ids.push(ship.ship_type_id); if(loc)ids.push(loc.solar_system_id); for(const s of topContacts)ids.push(s.contact_id); for(const sk of allSkills)ids.push(sk.skill_id); for(const c of histCorps){ ids.push(c); const a=corpInfo[c]?.alliance; if(a)ids.push(a); }
      const names=await resolveNames(ids);
      const skillGroups=await groupSkills(allSkills,names);
      const riskSkills=allSkills.map(s=>({name:names.get(s.skill_id)||'',level:s.trained_skill_level,label:riskLabel(names.get(s.skill_id)||'')})).filter(s=>s.label);
      const cynoSkills=riskSkills.filter(s=>/cyno/i.test(s.name));
      let mails=[]; if(Array.isArray(mail)&&mail.length){ const recent=mail.slice(0,15); const sn=await resolveNames(recent.map(m=>m.from));
        mails=await Promise.all(recent.map(async m=>{ let body=''; try{const f=await esi('/characters/'+id+'/mail/'+m.mail_id+'/',tok); body=stripHtml(f.body);}catch{} return {subject:m.subject||'',from:sn.get(m.from)||('#'+m.from),fromId:m.from,toIds:(m.recipients||[]).map(r=>r.recipient_id),date:m.timestamp,read:!!m.is_read,body}; })); }
      const ageY=info?((Date.now()-new Date(info.birthday))/(365.25*864e5)).toFixed(1):null;
      return {
        name:t.characterName,
        corpId:info?.corporation_id??null, corpName:info?(names.get(info.corporation_id)||null):null,
        allianceId:info?.alliance_id??null, allianceName:info?.alliance_id?(names.get(info.alliance_id)||null):null,
        sec:info?.security_status??null, birthday:info?.birthday??null, ageYears:Number(ageY)||null,
        wallet:typeof wallet==='number'?wallet:null, sp:skills?.total_sp??null, skillCount:skills?.skills?.length??null,
        mailCount:Array.isArray(mail)?mail.length:null, unread:Array.isArray(mail)?mail.filter(m=>!m.is_read).length:null,
        assets:Array.isArray(assets)?assets.length:null,
        systemId:loc?.solar_system_id??null, systemName:loc?(names.get(loc.solar_system_id)||null):null,
        shipTypeId:ship?.ship_type_id??null, shipName:ship?(names.get(ship.ship_type_id)||null):null,
        standings:topContacts.map(s=>({id:s.contact_id,type:s.contact_type,name:names.get(s.contact_id)||null,standing:s.standing})),
        corpHistory:histArr.map(h=>({corpId:h.corporation_id, corpName:names.get(h.corporation_id)||corpInfo[h.corporation_id]?.name||('Corp '+h.corporation_id), allianceId:corpInfo[h.corporation_id]?.alliance||null, allianceName:corpInfo[h.corporation_id]?.alliance?(names.get(corpInfo[h.corporation_id].alliance)||null):null, start:h.start_date})),
        cynoSkills, riskSkills,
        mails,
        skillGroups,
        wallet_journal:(Array.isArray(journal)?journal:[]).slice(0,40).map(j=>({date:j.date,type:j.ref_type,amount:j.amount,balance:j.balance,desc:j.description||''})),
        contracts:(Array.isArray(contracts)?contracts:[]).slice(0,40).map(c=>({id:c.contract_id,type:c.type,status:c.status,title:c.title||'',price:c.price,reward:c.reward,date:c.date_issued,issuerId:c.issuer_id,assigneeId:c.assignee_id,acceptorId:c.acceptor_id})),
      };
    }

      mails:{ ic:'✉', lbl:'Mails', count:d=>d.mails?.length, html:d=>!d.mails?.length?'<div class="empty">Geen mails gedeeld.</div>':
        d.mails.map(m=>'<div class="mail"'+(m._enemy?' style="border-color:var(--red)"':'')+'><div class="mailhdr">'+(m._enemy?'<span title="vijand" style="color:var(--red)">⚠</span>':(m.read?'':'<span style="color:var(--blue)">●</span>'))+'<span style="flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(m.subject||'(geen onderwerp)')+'</span>'+(m._suspect?'<span style="color:var(--gold);font-size:.62rem;flex-shrink:0" title="verdachte termen">⚑ '+esc(m._suspect.join(', '))+'</span>':'')+'<span style="color:'+(m._enemy?'var(--red)':'var(--text-dim)')+';flex-shrink:0">'+esc(m.from)+'</span></div>'+

      standings:{ ic:'⚖', lbl:'Standings', count:d=>d.standings?.length, html:d=>!d.standings?.length?'<div class="empty">Geen contacts gedeeld.</div>':
        '<div class="psec">'+d.standings.map(s=>{const c=s.standing>0?'var(--green)':s.standing<0?'var(--red)':'var(--text-dim)'; return row(esc(s.name||(s.type+' '+s.id)), s.standing.toFixed(1), c);}).join('')+'</div>' },
      history:{ ic:'🏛', lbl:'Alliance/Corp historie', count:d=>d.corpHistory?.length, html:d=>!d.corpHistory?.length?'<div class="empty">Geen alliance/corp-historie.</div>':
        '<div class="psec">'+d.corpHistory.map(h=>'<div class="prow"><span class="plabel">'+dt(h.start)+'</span><span class="pval" style="font-weight:500">'+esc(h.corpName)+(h.allianceName?' <span style="color:var(--text-dim)">· '+esc(h.allianceName)+'</span>':'')+'</span></div>').join('')+'</div>' },
      vetting:{ ic:'🛡', lbl:'Vetting', count:()=>null, html:d=>{
        if(!d.vetting) return '<div class="center" style="padding:2rem 0"><div class="spinner"></div><div class="sub">Standings van DL/Insidious controleren…</div></div>';
        const ic={bad:'⛔',warn:'⚠',ok:'✓',info:'ℹ'};
        const bad=d.vetting.filter(f=>f.lvl==='bad').length, warn=d.vetting.filter(f=>f.lvl==='warn').length;
        const v=bad?{c:'bad',t:'VERDACHT'}:warn?{c:'warn',t:'CONTROLEER'}:{c:'ok',t:'VEILIG'};
        const banner='<div class="verdict v-'+v.c+'">'+(ic[v.c]||'')+' '+v.t+'</div>';
        return banner+d.vetting.map(f=>'<div class="vflag v-'+f.lvl+'"><b>'+(ic[f.lvl]||'')+'</b> '+f.txt+'</div>').join(''); } },
    };
    const SECTION_ORDER = ['overview','skills','wallet','mails','contracts','standings','history'];

    // Vijandenlijst (standing<0) van Dutch Legions + Insidious — id → {standing, src}
    let _enemyCache=null;
    async function fetchEnemySet(adminToken){
      if(_enemyCache) return _enemyCache;
      const enemy=new Map();
      try{
        const me=await esi('/characters/'+ADMIN_CHAR_ID+'/');
        const srcs=[];
        if(me.corporation_id) srcs.push(['Dutch Legions', await esi('/corporations/'+me.corporation_id+'/contacts/',adminToken).catch(()=>null)]);
        if(me.alliance_id) srcs.push(['Insidious', await esi('/alliances/'+me.alliance_id+'/contacts/',adminToken).catch(()=>null)]);
        for(const [src,arr] of srcs){ if(Array.isArray(arr)) for(const c of arr){ if(c.standing<0 && !enemy.has(c.contact_id)) enemy.set(c.contact_id,{standing:c.standing,src}); } }
      }catch{}
      if(enemy.size) _enemyCache=enemy;
      return enemy;
    }

    // Snelle verdict-indicatie voor de lijst (alleen synchrone checks, geen affiliation-calls)
    function quickVerdict(d, enemy){
      let bad=0, warn=0;
      if(d.riskSkills?.length||d.cynoSkills?.length) warn++;
      if((d.mails||[]).some(m=>scanText((m.subject||'')+' '+(m.body||'')).length)) warn++;
      if(enemy&&enemy.size){
        if((d.corpHistory||[]).some(h=>enemy.has(h.corpId)||(h.allianceId&&enemy.has(h.allianceId)))) bad++;
        if((d.standings||[]).some(s=>s.standing>0&&enemy.has(s.id))) bad++;
        if((d.mails||[]).some(m=>enemy.has(m.fromId)||(m.toIds||[]).some(r=>enemy.has(r)))) bad++;
        if((d.contracts||[]).some(c=>[c.issuerId,c.assigneeId,c.acceptorId].some(p=>enemy.has(p)))) bad++;
      }
      return bad?{c:'bad',t:'VERDACHT'}:warn?{c:'warn',t:'CONTROLEER'}:{c:'ok',t:'VEILIG'};
    }

    // Vetting-check (admin, detail): vergelijk recruit met DL + Insidious standings + skills + mail + contracten.
    async function runVetting(d, adminToken, selfId){
      const flags=[];
      const rs=d.riskSkills||(d.cynoSkills||[]);
      if(rs.length){ const grp={}; for(const s of rs){ const l=s.label||riskLabel(s.name)||'Overig'; (grp[l]=grp[l]||[]).push(esc(s.name)+' L'+s.level); }
        flags.push({lvl:'warn', txt:'Risk-skills: '+Object.keys(grp).map(k=>'<b>'+k+'</b> ('+grp[k].join(', ')+')').join(' · ')}); }
      else flags.push({lvl:'ok', txt:'Geen cyno/covert/blops/recon/jump-skills.'});
      const enemy=await fetchEnemySet(adminToken);
      if(!enemy.size){ flags.push({lvl:'info', txt:'Kon DL/Insidious-standings niet laden (geen leesrechten op corp/alliance-contacts?). Standing- en historie-check overgeslagen.'}); return flags; }
      // Werkgevershistorie: zat hij in een vijandige corp/alliance?
      const hh=[]; for(const h of (d.corpHistory||[])){ if(enemy.has(h.corpId))hh.push(esc(h.corpName)+' (corp)'); if(h.allianceId&&enemy.has(h.allianceId))hh.push(esc(h.allianceName||h.corpName)+' (alliance)'); }
      if(hh.length) flags.push({lvl:'bad', txt:'Alliance/Corp-historie bevat vijand(en) van DL/Insidious: '+[...new Set(hh)].join(', ')});
      else flags.push({lvl:'ok', txt:'Geen vijanden in alliance/corp-historie.'});
      // Persoonlijke contacts: heeft hij een DL/Insidious-vijand blauw staan?
      const blue=(d.standings||[]).filter(s=>s.standing>0&&enemy.has(s.id)).map(s=>esc(s.name||('#'+s.id)));
      if(blue.length) flags.push({lvl:'bad', txt:'Heeft vijand(en) van DL/Insidious blauw in z\'n contacts: '+blue.join(', ')});
      else flags.push({lvl:'ok', txt:'Geen DL/Insidious-vijanden blauw in contacts.'});
      // Mailcontact met vijanden (afzender of ontvanger = vijand van DL/Insidious)
      if(d.mails?.length){
        const aff=await resolveAffiliations(d.mails.map(m=>m.fromId).filter(Boolean));
        const isEnemy=(cid)=>{ const a=aff.get(cid)||{}; return enemy.has(cid)||enemy.has(a.corp)||enemy.has(a.alliance); };
        const hits=[];
        for(const m of d.mails){
          if(m.fromId && isEnemy(m.fromId)){ m._enemy=true; hits.push('⬅ van <b>'+esc(m.from)+'</b>: "'+esc(m.subject||'(geen onderwerp)')+'"'); }
          else if((m.toIds||[]).some(rid=>enemy.has(rid))){ m._enemy=true; hits.push('➡ aan vijand: "'+esc(m.subject||'(geen onderwerp)')+'"'); }
        }
        if(hits.length) flags.push({lvl:'bad', txt:'Verdachte mails met DL/Insidious-vijanden:<br>'+hits.join('<br>')});
        else flags.push({lvl:'ok', txt:'Geen mailcontact met bekende vijanden (laatste '+d.mails.length+' mails).'});
        // Inhoud-scan: verdachte termen / externe links + namen van bekende vijanden
        const eNames=await resolveNames([...enemy.keys()]);
        const enemyNameList=[...eNames.values()].filter(n=>n && n.length>=4).map(n=>n.toLowerCase());
        const sus=[]; const allTerms=new Set();
        for(const m of d.mails){ const txt=(m.subject||'')+' '+(m.body||''); const terms=scanText(txt);
          const lc=txt.toLowerCase(); for(const en of enemyNameList){ if(lc.includes(en)) terms.push('vijand: '+en); }
          if(terms.length){ const uniq=[...new Set(terms)]; m._suspect=uniq; uniq.forEach(t=>allTerms.add(t)); sus.push('"'+esc(m.subject||'(geen onderwerp)')+'" → '+esc(uniq.join(', '))); } }
        if(sus.length) flags.push({lvl:'warn', txt:'Verdachte termen/links in mails ('+esc([...allTerms].join(', '))+'):<br>'+sus.join('<br>')});
        else flags.push({lvl:'ok', txt:'Geen verdachte termen of externe links in mails.'});
      }
      // Contracten met vijanden (uitgever/ontvanger/acceptor = vijand van DL/Insidious)
      if(d.contracts?.length){
        const parties=c=>[c.issuerId,c.assigneeId,c.acceptorId].filter(p=>p && p!==selfId);
        const allParties=[...new Set(d.contracts.flatMap(parties))];
        const aff=await resolveAffiliations(allParties);
        const pNames=await resolveNames(allParties);
        const isEnemyParty=p=>{ const a=aff.get(p)||{}; return enemy.has(p)||enemy.has(a.corp)||enemy.has(a.alliance); };
        const hits=[];
        for(const c of d.contracts){ const bad=parties(c).find(isEnemyParty); if(bad){ c._enemy=true; hits.push(esc((c.type||'').replace(/_/g,' '))+' ↔ <b>'+esc(pNames.get(bad)||('#'+bad))+'</b>'+(c.title?' ("'+esc(c.title)+'")':'')); } }
        if(hits.length) flags.push({lvl:'bad', txt:'Contracten met DL/Insidious-vijanden:<br>'+hits.join('<br>')});
        else flags.push({lvl:'ok', txt:'Geen contracten met bekende vijanden (laatste '+d.contracts.length+').'});
      }
      return flags;
    }

    // Render het dashboard (sidebar + content) voor een character-data-object.
    function renderDash(d, charId, opts){
      opts = opts || {};
      const order = opts.admin ? ['vetting',...SECTION_ORDER] : SECTION_ORDER;
      const navItems = order.map(k=>{ const s=SECTIONS[k]; const c=s.count(d); return ''+
        '<div class="ni" data-k="'+k+'"><span class="ic">'+s.ic+'</span><span class="lbl">'+s.lbl+'</span>'+(c!=null?'<span class="ct">'+c+'</span>':'')+'</div>'; }).join('');
      const footer = opts.admin
        ? '<button class="abtn" style="background:rgba(62,207,110,.15);color:var(--green)" id="acc">✓ Aannemen</button>'+
          '<button class="abtn" style="background:rgba(224,85,85,.12);color:var(--red)" id="rej">✕ Afwijzen</button>'+
          '<button class="btn" id="back" style="flex-basis:100%">← Terug naar lijst</button>'
        : '<button class="btn" id="logout" style="flex-basis:100%">Uitloggen</button>';
      root.innerHTML='<div class="shell"><div class="side">'+
        '<div class="side-h"><img class="pf" src="https://images.evetech.net/characters/'+charId+'/portrait?size=128" alt="" />'+
          '<div class="nm">'+esc(d.name||('#'+charId))+'</div>'+
          '<div class="org">'+(d.corpId?'<img src="https://images.evetech.net/corporations/'+d.corpId+'/logo?size=32">':'')+esc(d.corpName||'')+(d.allianceName?' · '+esc(d.allianceName):'')+'</div>'+
          (opts.status?'<div style="margin-top:.4rem">'+statusBadge(opts.status)+'</div>':'')+
        '</div><nav>'+navItems+'</nav><div class="side-f">'+footer+'</div></div>'+
        '<div class="main"><h2 id="title"></h2><div id="content"></div></div></div>';

      let curK;
      function show(k){ curK=k; root.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.dataset.k===k)); document.getElementById('title').textContent=SECTIONS[k].lbl; const c=document.getElementById('content'); c.innerHTML=SECTIONS[k].html(d);
        c.querySelectorAll('.mailhdr').forEach(h=>h.onclick=()=>{const b=h.nextElementSibling; b.style.display=b.style.display==='none'?'block':'none';});
        if(k==='vetting' && !d.vetting && opts.admin){ runVetting(d, opts.adminToken, charId).then(f=>{ d.vetting=f; if(curK==='vetting'){ const cc=document.getElementById('content'); if(cc)cc.innerHTML=SECTIONS.vetting.html(d); } }); } }
      root.querySelectorAll('.ni').forEach(n=>n.onclick=()=>show(n.dataset.k));
      show(opts.admin?'vetting':'overview');

      if(opts.admin){
        const act=async q=>{ await fetch(API+'/recruit_list.php?token='+encodeURIComponent(opts.adminToken)+'&'+q).catch(()=>{}); opts.back(); };
        document.getElementById('acc').onclick=()=>act('status=accepted&id='+charId);
        document.getElementById('rej').onclick=()=>act('status=rejected&id='+charId);
        document.getElementById('back').onclick=opts.back;
      } else {
        document.getElementById('logout').onclick=()=>{ localStorage.removeItem(STORE_KEY); location.href=REDIRECT_URI; };
      }
    }

    function statusBadge(s){ const c=s==='accepted'?'b-accepted':s==='rejected'?'b-rejected':'b-new'; const l=s==='accepted'?'AANGENOMEN':s==='rejected'?'AFGEWEZEN':'NIEUW'; return '<span class="badge '+c+'">'+l+'</span>'; }

    // ── Recruit: data ophalen, opslaan, dashboard tonen ─────────────────────────
    async function renderRecruit(t){
      root.innerHTML='<div class="center"><div class="card"><div class="spinner"></div><div class="sub">Je gegevens worden opgehaald…</div></div></div>';
      let d; try { d=await gatherData(t); } catch(e){ renderLogin('Kon gegevens niet laden: '+(e.message||e)); return; }
      try { await fetch(API+'/recruit_submit.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:t.accessToken,data:d})}); } catch {}
      renderDash(d, t.characterId, { recruit:true });
    }

    // ── Admin: lijst + detail ────────────────────────────────────────────────────
    async function renderAdmin(t){
      const isOwner=(t.characterId===ADMIN_CHAR_ID);
      root.innerHTML='<div class="main"><div class="ahead"><h1>Recruiting <span>· Aanmeldingen</span></h1><div style="display:flex;gap:.5rem">'+(isOwner?'<button class="btn" id="manage">👥 Recruiters</button>':'')+'<button class="btn" id="refresh">↻ Vernieuwen</button><button class="btn" id="logout">Uitloggen</button></div></div><div id="list"><div class="center" style="padding:2rem 0"><div class="spinner"></div><div class="sub">Aanmeldingen + DL/Insidious-standings laden…</div></div></div></div>';
      document.getElementById('logout').onclick=()=>{ localStorage.removeItem(STORE_KEY); location.href=REDIRECT_URI; };
      document.getElementById('refresh').onclick=()=>{ _enemyCache=null; renderAdmin(t); };
      if(isOwner) document.getElementById('manage').onclick=()=>manageRecruiters(t);
      const list=document.getElementById('list'); let rows=[];
      try { const r=await fetch(API+'/recruit_list.php?token='+encodeURIComponent(t.accessToken)); if(!r.ok)throw new Error(r.status===403?'Geen toegang':('HTTP '+r.status)); rows=await r.json(); }
      catch(e){ list.innerHTML='<div class="err">Kon aanmeldingen niet laden: '+esc(e.message||'')+'</div>'; return; }
      if(!rows.length){ list.innerHTML='<div class="empty">Nog geen aanmeldingen.</div>'; return; }
      const parsed=rows.map(r=>{ let d={}; try{d=JSON.parse(r.data)||{};}catch{} return {...r,d}; });
      const enemy=await fetchEnemySet(t.accessToken);
      parsed.forEach(r=>{ r.verdict=quickVerdict(r.d, enemy); });
      const counts={all:parsed.length, new:0, accepted:0, rejected:0};
      parsed.forEach(r=>{ counts[r.status]=(counts[r.status]||0)+1; });
      const state={status:'all', q:'', sort:'recent'};

      const chip=(k,l)=>'<div class="stat'+(state.status===k?' on':'')+'" data-st="'+k+'"><div class="n">'+(counts[k]||0)+'</div><div class="l">'+l+'</div></div>';
      list.innerHTML=
        '<div class="astats">'+chip('all','Totaal')+chip('new','Nieuw')+chip('accepted','Aangenomen')+chip('rejected','Afgewezen')+'</div>'+
        (enemy.size?'':'<div class="vflag v-info" style="margin-bottom:.7rem">ℹ DL/Insidious-vijandenlijst niet geladen (geen leesrechten?) — verdict toont alleen skill/mail-signalen.</div>')+
        '<div class="atools"><input id="q" placeholder="🔎 Zoek op naam, corp of alliance…">'+
          '<select id="sort"><option value="recent">Nieuwste eerst</option><option value="old">Oudste eerst</option>'+
          '<option value="risk">Risico (verdacht eerst)</option><option value="name">Naam A-Z</option>'+
          '<option value="sp">SP (hoog→laag)</option><option value="wallet">Wallet (hoog→laag)</option>'+
          '<option value="sec">Sec (laag→hoog)</option><option value="age">Leeftijd (oud→jong)</option></select></div>'+
        '<div id="grid"></div>';

      const grid=document.getElementById('grid'); const vRank={bad:0,warn:1,ok:2}; const num=v=>v==null?-Infinity:v;
      const refreshStats=()=>document.querySelectorAll('.stat').forEach(s=>{ const k=s.dataset.st; s.querySelector('.n').textContent=counts[k]||0; s.classList.toggle('on',state.status===k); });
      function draw(){
        let arr=parsed.slice();
        if(state.status!=='all') arr=arr.filter(r=>r.status===state.status);
        if(state.q){ const q=state.q.toLowerCase(); arr=arr.filter(r=>((r.d.name||r.name||'')+' '+(r.d.corpName||'')+' '+(r.d.allianceName||'')).toLowerCase().includes(q)); }
        arr.sort((a,b)=>{ const A=a.d,B=b.d; switch(state.sort){
          case 'old': return new Date(a.created_at||a.updated_at)-new Date(b.created_at||b.updated_at);
          case 'name': return (A.name||a.name||'').localeCompare(B.name||b.name||'');
          case 'sp': return num(B.sp)-num(A.sp);
          case 'wallet': return num(B.wallet)-num(A.wallet);
          case 'sec': return num(A.sec)-num(B.sec);
          case 'age': return num(B.ageYears)-num(A.ageYears);
          case 'risk': return (vRank[a.verdict.c]-vRank[b.verdict.c]) || (new Date(b.updated_at||0)-new Date(a.updated_at||0));
          default: return new Date(b.updated_at||b.created_at||0)-new Date(a.updated_at||a.created_at||0); } });
        if(!arr.length){ grid.innerHTML='<div class="empty">Geen aanmeldingen die aan het filter voldoen.</div>'; return; }
        grid.innerHTML='<div class="rgrid">'+arr.map(r=>{ const d=r.d, v=r.verdict; return ''+
          '<div class="rcard" data-id="'+r.character_id+'"><span class="vdot v-'+v.c+'" title="'+v.t+'"></span>'+
          '<img class="p" src="https://images.evetech.net/characters/'+r.character_id+'/portrait?size=64" alt="" />'+
          '<div style="flex:1;min-width:0"><div class="rname">'+esc(d.name||r.name||('#'+r.character_id))+' '+statusBadge(r.status)+(d.cynoSkills?.length?' <span class="badge" style="background:rgba(240,192,64,.18);color:var(--gold)">⚠ CYNO</span>':'')+'</div>'+
          '<div class="rmeta">'+(d.corpId?'<img src="https://images.evetech.net/corporations/'+d.corpId+'/logo?size=32">':'')+esc(d.corpName||'')+(d.allianceName?' · '+esc(d.allianceName):'')+'</div>'+
          '<div class="rstats">sec '+(d.sec!=null?d.sec.toFixed(1):'?')+' · '+(d.ageYears!=null?d.ageYears+'j':'?')+' · '+(d.wallet!=null?fmtISK(d.wallet)+' ISK':'🔒')+' · '+(d.sp!=null?fmtSP(d.sp)+' SP':'?')+' · '+dt(r.updated_at||r.created_at)+'</div>'+
          '<div class="racts"><button class="a-acc" data-act="accepted" data-id="'+r.character_id+'">✓ Aannemen</button><button class="a-rej" data-act="rejected" data-id="'+r.character_id+'">✕ Afwijzen</button><button class="a-del" data-act="delete" data-id="'+r.character_id+'">🗑</button></div>'+
          '</div></div>'; }).join('')+'</div>';
        grid.querySelectorAll('.rcard').forEach(el=>el.onclick=e=>{ if(e.target.closest('.racts'))return; const r=parsed.find(x=>String(x.character_id)===el.dataset.id); renderDash(r.d, r.character_id, {admin:true, adminToken:t.accessToken, status:r.status, back:()=>renderAdmin(t)}); });
        grid.querySelectorAll('.racts button').forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const act=b.dataset.act, cid=b.dataset.id;
          if(act==='delete'){ if(!confirm('Aanmelding definitief verwijderen?'))return; await fetch(API+'/recruit_list.php?token='+encodeURIComponent(t.accessToken)+'&delete='+cid).catch(()=>{}); const i=parsed.findIndex(x=>String(x.character_id)===cid); if(i>=0){ counts.all--; counts[parsed[i].status]=(counts[parsed[i].status]||1)-1; parsed.splice(i,1); } refreshStats(); draw(); return; }
          await fetch(API+'/recruit_list.php?token='+encodeURIComponent(t.accessToken)+'&status='+act+'&id='+cid).catch(()=>{}); const r=parsed.find(x=>String(x.character_id)===cid); if(r){ counts[r.status]=(counts[r.status]||1)-1; r.status=act; counts[act]=(counts[act]||0)+1; } refreshStats(); draw(); });
      }
      document.querySelectorAll('.stat').forEach(s=>s.onclick=()=>{ state.status=s.dataset.st; refreshStats(); draw(); });
      document.getElementById('q').oninput=e=>{ state.q=e.target.value; draw(); };
      document.getElementById('sort').onchange=e=>{ state.sort=e.target.value; draw(); };
      draw();
    }

    // Recruiters beheren (alleen eigenaar): toevoegen op naam + verwijderen.
    function manageRecruiters(t){
      const bg=document.createElement('div'); bg.className='modal-bg';
      bg.innerHTML='<div class="modal"><h3>👥 Recruiters beheren</h3>'+
        '<div class="atools" style="margin-bottom:.5rem"><input id="rname" placeholder="Character-naam…"><button class="btn" id="radd">Toevoegen</button></div>'+
        '<div id="amsg" style="font-size:.72rem;color:var(--text-dim);min-height:1rem;margin-bottom:.5rem"></div>'+
        '<div id="alist"><div class="spinner"></div></div>'+
        '<div style="text-align:right;margin-top:1rem"><button class="btn" id="aclose">Sluiten</button></div></div>';
      document.body.appendChild(bg);
      const close=()=>bg.remove(); bg.onclick=e=>{ if(e.target===bg)close(); }; bg.querySelector('#aclose').onclick=close;
      const msg=bg.querySelector('#amsg'), nameInp=bg.querySelector('#rname');
      async function load(){ const lst=bg.querySelector('#alist'); lst.innerHTML='<div class="spinner"></div>';
        let data; try{ const r=await fetch(API+'/recruit_admins.php?token='+encodeURIComponent(t.accessToken)); if(!r.ok)throw 0; data=await r.json(); }catch{ lst.innerHTML='<div class="err">Kon recruiters niet laden.</div>'; return; }
        const admins=data.admins||[];
        let h='<div class="arow"><span><img src="https://images.evetech.net/characters/'+data.owner_id+'/portrait?size=32">Eigenaar (jij)</span><span style="color:var(--text-dim);font-size:.7rem">vast</span></div>';
        h+=admins.map(a=>'<div class="arow"><span><img src="https://images.evetech.net/characters/'+a.character_id+'/portrait?size=32">'+esc(a.name||('#'+a.character_id))+'</span><button class="btn" data-rm="'+a.character_id+'">Verwijderen</button></div>').join('');
        if(!admins.length) h+='<div class="empty">Nog geen extra recruiters.</div>';
        lst.innerHTML=h;
        lst.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{ await fetch(API+'/recruit_admins.php?token='+encodeURIComponent(t.accessToken)+'&remove='+b.dataset.rm).catch(()=>{}); load(); });
      }
      bg.querySelector('#radd').onclick=async()=>{ const name=nameInp.value.trim(); if(!name)return; msg.textContent='Zoeken…';
        const c=await charIdByName(name); if(!c){ msg.textContent='Character "'+name+'" niet gevonden.'; return; }
        const r=await fetch(API+'/recruit_admins.php?token='+encodeURIComponent(t.accessToken)+'&add='+c.id+'&name='+encodeURIComponent(c.name)).catch(()=>null);
        if(r&&r.ok){ msg.textContent=c.name+' toegevoegd als recruiter.'; nameInp.value=''; load(); } else { msg.textContent='Toevoegen mislukt (alleen de eigenaar mag dit).'; } };
      load();
    }

    async function afterLogin(t){
      if(t.characterId===ADMIN_CHAR_ID) return renderAdmin(t);
      // Server bepaalt of dit character recruiter-admin is (403 = geen admin)
      try{ const r=await fetch(API+'/recruit_admins.php?token='+encodeURIComponent(t.accessToken)); if(r.ok) return renderAdmin(t); }catch{}
      renderRecruit(t);
    }

    // ── Init ────────────────────────────────────────────────────────────────────
    (async ()=>{
      const u=new URLSearchParams(location.search); const code=u.get('code'), state=u.get('state');
      if(code&&state){ try{ const t=await exchange(code,state); localStorage.setItem(STORE_KEY,JSON.stringify(t)); history.replaceState({},'',REDIRECT_URI); afterLogin(t); }
        catch(e){ history.replaceState({},'',REDIRECT_URI); renderLogin(e.message||'Login mislukt'); } return; }
      const saved=localStorage.getItem(STORE_KEY); if(saved){ try{ return afterLogin(JSON.parse(saved)); }catch{} }
      renderLogin();
    })();
  </script>
</body>
</html>

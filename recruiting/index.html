<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dutch Legions — Recruiting</title>
  <style>
    :root { --bg:#05050e; --surface:#0f0f22; --border:#1c1c35; --text:#e1e4f0; --text-dim:#8a90b0; --blue:#00b4d8; --gold:#f0c040; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:
        radial-gradient(120% 120% at 20% 0%, rgba(0,180,216,0.12), transparent 55%),
        radial-gradient(100% 120% at 90% 100%, rgba(240,192,64,0.08), transparent 55%), var(--bg);
      color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
      display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px;
      box-shadow:0 8px 40px rgba(0,0,0,0.5); padding:2.5rem 2.25rem; max-width:420px; width:100%; text-align:center; }
    h1 { font-size:1.4rem; letter-spacing:0.04em; margin:0 0 0.3rem; }
    h1 span { color:var(--blue); }
    .sub { color:var(--text-dim); font-size:0.85rem; margin-bottom:1.75rem; line-height:1.6; }
    .login-btn { background:none; border:none; cursor:pointer; padding:0; transition:filter .15s, transform .15s; }
    .login-btn:hover { filter:brightness(1.15); transform:translateY(-1px); }
    .portrait { width:96px; height:96px; border-radius:50%; border:2px solid var(--blue);
      box-shadow:0 0 18px rgba(0,180,216,0.4); margin-bottom:0.9rem; }
    .name { font-size:1.2rem; font-weight:700; }
    .ok { color:var(--gold); font-size:0.8rem; margin:0.5rem 0 1.4rem; }
    .btn { display:inline-block; background:rgba(224,85,85,0.1); border:1px solid rgba(224,85,85,0.4);
      color:#e05555; border-radius:5px; font-size:0.78rem; font-weight:600; padding:0.5rem 1rem; cursor:pointer; }
    .err { color:#e05555; font-size:0.8rem; margin-top:1rem; }
    .foot { margin-top:1.5rem; font-size:0.62rem; color:var(--text-dim); }
    .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--blue);
      border-radius:50%; animation:spin 0.8s linear infinite; margin:1rem auto; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .psec { background:rgba(0,0,0,0.2); border:1px solid var(--border); border-radius:6px; overflow:hidden; text-align:left; }
    .prow { display:flex; justify-content:space-between; align-items:center; gap:0.6rem;
      padding:0.4rem 0.7rem; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.74rem; }
    .prow:last-child { border-bottom:none; }
    .plabel { color:var(--text-dim); }
    .pval { font-weight:700; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .psub { text-align:left; font-size:0.58rem; font-weight:700; letter-spacing:0.12em; color:var(--text-dim); margin:0.8rem 0 0.4rem; }
    /* Admin-overzicht */
    .admin { max-width:1100px; width:100%; }
    .ahead { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.1rem; }
    .ahead h1 { margin:0; font-size:1.3rem; }
    .rgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:0.75rem; }
    .rcard { display:flex; gap:0.7rem; align-items:center; background:var(--surface); border:1px solid var(--border);
      border-radius:8px; padding:0.7rem 0.8rem; cursor:pointer; text-align:left; transition:border-color .15s, transform .1s; }
    .rcard:hover { border-color:var(--blue); transform:translateY(-1px); }
    .rcard img.p { width:52px; height:52px; border-radius:50%; border:1px solid var(--border); flex-shrink:0; }
    .rname { font-weight:700; font-size:0.85rem; }
    .rmeta { font-size:0.62rem; color:var(--text-dim); margin-top:0.1rem; display:flex; align-items:center; gap:0.3rem; flex-wrap:wrap; }
    .rmeta img { width:16px; height:16px; border-radius:2px; }
    .rstats { font-size:0.62rem; color:var(--text-dim); margin-top:0.2rem; }
    .badge { font-size:0.55rem; font-weight:700; padding:0.1rem 0.4rem; border-radius:10px; letter-spacing:0.05em; }
    .b-new { background:rgba(0,180,216,0.15); color:var(--blue); }
    .b-accepted { background:rgba(62,207,110,0.15); color:#3ecf6e; }
    .b-rejected { background:rgba(224,85,85,0.15); color:#e05555; }
    .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center; padding:1.5rem; z-index:100; }
    .modal { background:var(--surface); border:1px solid var(--blue); border-radius:10px; max-width:520px; width:100%; max-height:88vh; overflow-y:auto; text-align:left; }
    .mhead { display:flex; align-items:center; gap:0.8rem; padding:1rem; border-bottom:1px solid var(--border); }
    .mbody { padding:1rem; }
    .abtn { border:none; border-radius:4px; font-size:0.72rem; font-weight:600; padding:0.4rem 0.8rem; cursor:pointer; }
  </style>
</head>
<body>
  <div class="card" id="app">
    <div class="spinner"></div>
  </div>

  <script>
    // ── Configuratie ──────────────────────────────────────────────────────────
    const CLIENT_ID    = 'ea612f44ca444a50bb205e27d2fa3ead';
    const REDIRECT_URI = 'https://recruiting.dutchlegionsdashboard.eu';
    const SCOPES       = [
      'publicData',
      'esi-wallet.read_character_wallet.v1',
      'esi-mail.read_mail.v1',
      'esi-characters.read_standings.v1',
      'esi-characters.read_contacts.v1',
      'esi-skills.read_skills.v1',
      'esi-location.read_location.v1',
      'esi-location.read_ship_type.v1',
      'esi-assets.read_assets.v1',
      'esi-clones.read_clones.v1',
    ].join(' ');
    const STORE_KEY    = 'recruit_token';
    const ESI = 'https://esi.evetech.net/latest';
    const API = 'https://dutchlegionsdashboard.eu/api';   // dashboard-backend (zelfde DB)
    const ADMIN_CHAR_ID = 1831618559;

    const app = document.getElementById('app');

    // ── PKCE helpers ────────────────────────────────────────────────────────────
    function b64url(bytes) {
      return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    }
    async function pkce() {
      const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
      const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
      return { verifier, challenge: b64url(new Uint8Array(hash)) };
    }

    async function startLogin() {
      const { verifier, challenge } = await pkce();
      const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
      sessionStorage.setItem('pkce_verifier', verifier);
      sessionStorage.setItem('oauth_state', state);
      const params = new URLSearchParams({
        response_type: 'code', client_id: CLIENT_ID, redirect_uri: REDIRECT_URI,
        scope: SCOPES, state, code_challenge: challenge, code_challenge_method: 'S256',
      });
      location.href = 'https://login.eveonline.com/v2/oauth/authorize?' + params;
    }

    async function exchange(code, state) {
      if (state !== sessionStorage.getItem('oauth_state')) throw new Error('State mismatch — probeer opnieuw.');
      const verifier = sessionStorage.getItem('pkce_verifier');
      if (!verifier) throw new Error('Geen PKCE-verifier — probeer opnieuw.');
      sessionStorage.removeItem('oauth_state'); sessionStorage.removeItem('pkce_verifier');
      const res = await fetch('https://login.eveonline.com/v2/oauth/token', {
        method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({ grant_type: 'authorization_code', code, client_id: CLIENT_ID, code_verifier: verifier }),
      });
      if (!res.ok) throw new Error('Token-uitwisseling mislukt (' + res.status + ')');
      const d = await res.json();
      const payload = JSON.parse(atob(d.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      const sub = String(payload.sub);
      const charId = parseInt(sub.includes(':') ? sub.split(':').pop() : sub, 10);
      return { accessToken: d.access_token, refreshToken: d.refresh_token,
        expiresAt: Date.now() + d.expires_in * 1000, characterId: charId, characterName: payload.name };
    }

    // ── Weergave ────────────────────────────────────────────────────────────────
    function renderLogin(err) {
      app.innerHTML =
        '<h1>Dutch Legions <span>Recruiting</span></h1>' +
        '<div class="sub">Log in met je EVE Online-character om te beginnen met je aanmelding.</div>' +
        '<button class="login-btn" id="login" aria-label="Log in met EVE Online">' +
          '<img src="https://web.ccpgamescdn.com/eveonlineassets/developers/eve-sso-login-black-large.png" alt="LOG IN with EVE Online" width="270" />' +
        '</button>' +
        (err ? '<div class="err">' + err + '</div>' : '') +
        '<div class="foot">Beveiligd via EVE Online SSO · Dutch Legions</div>';
      document.getElementById('login').onclick = () => startLogin();
    }

    // ── ESI helpers ─────────────────────────────────────────────────────────────
    function fmtISK(v) {
      const a = Math.abs(v), n = v < 0 ? '-' : '';
      if (a >= 1e9) return n + (a/1e9).toFixed(2) + 'B';
      if (a >= 1e6) return n + (a/1e6).toFixed(1) + 'M';
      if (a >= 1e3) return n + (a/1e3).toFixed(0) + 'K';
      return n + a.toFixed(0);
    }
    function fmtSP(v) { return v >= 1e6 ? (v/1e6).toFixed(1) + 'M' : v >= 1e3 ? (v/1e3).toFixed(0) + 'K' : String(v); }
    function secColor(s) { return s >= 0.5 ? '#3ecf6e' : s > 0 ? '#f0c040' : '#e05555'; }
    async function esi(path, token) {
      const res = await fetch(ESI + path + (path.includes('?') ? '&' : '?') + 'datasource=tranquility',
        token ? { headers: { Authorization: 'Bearer ' + token } } : undefined);
      if (!res.ok) throw new Error(path + ' ' + res.status);
      return res.json();
    }
    async function resolveNames(ids) {
      const out = new Map();
      const uniq = [...new Set(ids.filter(Boolean))];
      if (!uniq.length) return out;
      try {
        const res = await fetch(ESI + '/universe/names/?datasource=tranquility', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(uniq) });
        if (res.ok) for (const x of await res.json()) out.set(x.id, x.name);
      } catch {}
      return out;
    }

    function renderLoggedIn(t) {
      if (t.characterId === ADMIN_CHAR_ID) { renderAdmin(t); return; }
      app.style.maxWidth = '460px';
      app.innerHTML =
        '<img class="portrait" src="https://images.evetech.net/characters/' + t.characterId + '/portrait?size=128" alt="" />' +
        '<div class="name">' + t.characterName + '</div>' +
        '<div class="ok">✓ Ingelogd via EVE Online</div>' +
        '<div id="profile"><div class="spinner"></div></div>' +
        '<div class="sub" id="subnote" style="margin-top:0.9rem"></div>' +
        '<button class="btn" id="logout" style="margin-top:0.4rem">Uitloggen</button>' +
        '<div class="foot">Dutch Legions · Recruiting</div>';
      document.getElementById('logout').onclick = () => { localStorage.removeItem(STORE_KEY); location.href = REDIRECT_URI; };
      loadProfile(t);
    }

    function row(label, value, color) {
      return '<div class="prow"><span class="plabel">' + label + '</span><span class="pval"' +
        (color ? ' style="color:' + color + '"' : '') + '>' + value + '</span></div>';
    }

    async function loadProfile(t) {
      const id = t.characterId, tok = t.accessToken;
      const box = document.getElementById('profile');
      try {
        const [info, wallet, mail, standings, skills, loc, ship, assets] = await Promise.all([
          esi('/characters/' + id + '/').catch(() => null),
          esi('/characters/' + id + '/wallet/', tok).catch(() => null),
          esi('/characters/' + id + '/mail/', tok).catch(() => null),
          esi('/characters/' + id + '/standings/', tok).catch(() => null),
          esi('/characters/' + id + '/skills/', tok).catch(() => null),
          esi('/characters/' + id + '/location/', tok).catch(() => null),
          esi('/characters/' + id + '/ship/', tok).catch(() => null),
          esi('/characters/' + id + '/assets/', tok).catch(() => null),
        ]);

        const ids = [];
        if (info) { if (info.corporation_id) ids.push(info.corporation_id); if (info.alliance_id) ids.push(info.alliance_id); }
        if (ship) ids.push(ship.ship_type_id);
        if (loc) ids.push(loc.solar_system_id);
        for (const s of (standings || []).slice(0, 8)) ids.push(s.from_id);
        const names = await resolveNames(ids);

        const ageY = info ? ((Date.now() - new Date(info.birthday)) / (365.25*86400000)).toFixed(1) : '—';
        const unread = Array.isArray(mail) ? mail.filter(m => !m.is_read).length : null;

        let html = '<div class="psec">';
        if (info) {
          html += row('Corp', (info.corporation_id ? names.get(info.corporation_id) || ('Corp ' + info.corporation_id) : '—'), '#f97316');
          if (info.alliance_id) html += row('Alliance', names.get(info.alliance_id) || ('Alliance ' + info.alliance_id), '#00b4d8');
          html += row('Sec status', info.security_status.toFixed(2), secColor(info.security_status));
          html += row('Leeftijd', ageY + ' jaar');
        }
        html += row('Wallet', wallet != null ? fmtISK(wallet) + ' ISK' : '🔒 geen toegang', wallet != null ? '#f0c040' : '#8a90b0');
        if (skills) html += row('Skillpoints', fmtSP(skills.total_sp) + ' SP');
        if (Array.isArray(mail)) html += row('Mail', mail.length + ' berichten' + (unread != null ? ' (' + unread + ' ongelezen)' : ''));
        if (Array.isArray(assets)) html += row('Assets', assets.length + ' items');
        if (loc) html += row('Locatie', '⬡ ' + (names.get(loc.solar_system_id) || loc.solar_system_id) + (ship ? ' · ' + (names.get(ship.ship_type_id) || 'schip') : ''));
        html += '</div>';

        if (Array.isArray(standings) && standings.length) {
          html += '<div class="psub">STANDINGS</div><div class="psec">';
          for (const s of standings.slice(0, 8)) {
            const col = s.standing > 0 ? '#3ecf6e' : s.standing < 0 ? '#e05555' : '#8a90b0';
            html += row(names.get(s.from_id) || (s.from_type + ' ' + s.from_id), s.standing.toFixed(1), col);
          }
          html += '</div>';
        }

        box.innerHTML = html;

        // Aanmelding opslaan in de database (geverifieerd via de token, server-side).
        const summary = {
          name: t.characterName,
          corpId: info?.corporation_id ?? null, corpName: info ? (names.get(info.corporation_id) || null) : null,
          allianceId: info?.alliance_id ?? null, allianceName: info?.alliance_id ? (names.get(info.alliance_id) || null) : null,
          sec: info?.security_status ?? null, birthday: info?.birthday ?? null, ageYears: Number(ageY) || null,
          wallet: typeof wallet === 'number' ? wallet : null,
          sp: skills?.total_sp ?? null,
          mailCount: Array.isArray(mail) ? mail.length : null, unread,
          assets: Array.isArray(assets) ? assets.length : null,
          systemId: loc?.solar_system_id ?? null, systemName: loc ? (names.get(loc.solar_system_id) || null) : null,
          shipTypeId: ship?.ship_type_id ?? null, shipName: ship ? (names.get(ship.ship_type_id) || null) : null,
          standings: (standings || []).slice(0, 20).map(s => ({ id: s.from_id, type: s.from_type, name: names.get(s.from_id) || null, standing: s.standing })),
        };
        try {
          const res = await fetch(API + '/recruit_submit.php', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: t.accessToken, data: summary }),
          });
          const note = document.getElementById('subnote');
          if (note) note.innerHTML = res.ok
            ? '<span style="color:var(--gold)">✓ Je aanmelding is verzonden naar de recruiters.</span>'
            : '<span style="color:#e05555">Aanmelding kon niet worden opgeslagen.</span>';
        } catch { /* offline */ }
      } catch (e) {
        box.innerHTML = '<div class="err">Kon profiel niet laden: ' + (e.message || e) + '</div>';
      }
    }

    // ── Admin-overzicht ─────────────────────────────────────────────────────────
    function statusBadge(s) {
      const cls = s === 'accepted' ? 'b-accepted' : s === 'rejected' ? 'b-rejected' : 'b-new';
      const lbl = s === 'accepted' ? 'AANGENOMEN' : s === 'rejected' ? 'AFGEWEZEN' : 'NIEUW';
      return '<span class="badge ' + cls + '">' + lbl + '</span>';
    }

    async function renderAdmin(t) {
      app.className = 'admin'; app.style.maxWidth = '1100px';
      app.innerHTML = '<div class="ahead"><h1>Recruiting <span style="color:var(--blue)">· Aanmeldingen</span></h1>' +
        '<button class="btn" id="logout">Uitloggen</button></div><div id="list"><div class="spinner"></div></div>';
      document.getElementById('logout').onclick = () => { localStorage.removeItem(STORE_KEY); location.href = REDIRECT_URI; };
      const list = document.getElementById('list');
      let rows = [];
      try {
        const res = await fetch(API + '/recruit_list.php?token=' + encodeURIComponent(t.accessToken));
        if (!res.ok) throw new Error(res.status === 403 ? 'Geen toegang' : ('HTTP ' + res.status));
        rows = await res.json();
      } catch (e) { list.innerHTML = '<div class="err">Kon aanmeldingen niet laden: ' + (e.message || e) + '</div>'; return; }

      if (!rows.length) { list.innerHTML = '<div class="sub">Nog geen aanmeldingen.</div>'; return; }

      const parsed = rows.map(r => { let d = {}; try { d = JSON.parse(r.data) || {}; } catch {} return { ...r, d }; });
      list.innerHTML = '<div class="rgrid">' + parsed.map(r => {
        const d = r.d;
        return '<div class="rcard" data-id="' + r.character_id + '">' +
          '<img class="p" src="https://images.evetech.net/characters/' + r.character_id + '/portrait?size=64" alt="" />' +
          '<div style="flex:1;min-width:0">' +
            '<div class="rname">' + (d.name || r.name || ('#' + r.character_id)) + ' ' + statusBadge(r.status) + '</div>' +
            '<div class="rmeta">' +
              (d.corpId ? '<img src="https://images.evetech.net/corporations/' + d.corpId + '/logo?size=32">' : '') +
              (d.corpName || '') +
              (d.allianceName ? ' · ' + d.allianceName : '') +
            '</div>' +
            '<div class="rstats">' +
              'sec ' + (d.sec != null ? d.sec.toFixed(1) : '?') +
              ' · ' + (d.ageYears != null ? d.ageYears + 'j' : '?') +
              ' · ' + (d.wallet != null ? fmtISK(d.wallet) + ' ISK' : '🔒') +
              ' · ' + (d.sp != null ? fmtSP(d.sp) + ' SP' : '?') +
            '</div>' +
          '</div></div>';
      }).join('') + '</div>';

      list.querySelectorAll('.rcard').forEach(el => {
        el.onclick = () => openRecruit(parsed.find(r => String(r.character_id) === el.dataset.id), t);
      });
    }

    function openRecruit(r, t) {
      const d = r.d;
      const ov = document.createElement('div'); ov.className = 'overlay';
      ov.onclick = e => { if (e.target === ov) ov.remove(); };
      const line = (l, v) => '<div class="prow"><span class="plabel">' + l + '</span><span class="pval">' + v + '</span></div>';
      let st = '';
      if (Array.isArray(d.standings) && d.standings.length) {
        st = '<div class="psub">STANDINGS</div><div class="psec">' + d.standings.slice(0, 12).map(s => {
          const c = s.standing > 0 ? '#3ecf6e' : s.standing < 0 ? '#e05555' : '#8a90b0';
          return '<div class="prow"><span class="plabel">' + (s.name || (s.type + ' ' + s.id)) + '</span><span class="pval" style="color:' + c + '">' + s.standing.toFixed(1) + '</span></div>';
        }).join('') + '</div>';
      }
      ov.innerHTML = '<div class="modal">' +
        '<div class="mhead">' +
          '<img src="https://images.evetech.net/characters/' + r.character_id + '/portrait?size=128" style="width:64px;height:64px;border-radius:50%;border:2px solid var(--blue)" />' +
          '<div><div class="rname" style="font-size:1.1rem">' + (d.name || r.name) + '</div>' +
            '<div class="rmeta">' + (d.corpName || '') + (d.allianceName ? ' · ' + d.allianceName : '') + '</div>' +
            '<a href="https://zkillboard.com/character/' + r.character_id + '/" target="_blank" rel="noreferrer" style="font-size:0.62rem;color:var(--blue);text-decoration:none">zKillboard ↗</a>' +
          '</div>' +
          '<span style="margin-left:auto">' + statusBadge(r.status) + '</span>' +
        '</div>' +
        '<div class="mbody">' +
          '<div class="psec">' +
            line('Sec status', d.sec != null ? d.sec.toFixed(2) : '?') +
            line('Leeftijd', (d.ageYears != null ? d.ageYears + ' jaar' : '?')) +
            line('Wallet', d.wallet != null ? fmtISK(d.wallet) + ' ISK' : '🔒 niet gedeeld') +
            line('Skillpoints', d.sp != null ? fmtSP(d.sp) + ' SP' : '?') +
            line('Mail', d.mailCount != null ? (d.mailCount + ' (' + (d.unread ?? 0) + ' ongelezen)') : '?') +
            line('Assets', d.assets != null ? (d.assets + ' items') : '?') +
            line('Locatie', d.systemName ? ('⬡ ' + d.systemName + (d.shipName ? ' · ' + d.shipName : '')) : '?') +
            line('Aangemeld', new Date(r.created_at + 'Z').toLocaleString('nl-NL')) +
          '</div>' + st +
          '<div style="display:flex;gap:0.5rem;margin-top:1rem">' +
            '<button class="abtn" id="acc" style="background:rgba(62,207,110,0.15);color:#3ecf6e">✓ Aannemen</button>' +
            '<button class="abtn" id="rej" style="background:rgba(224,85,85,0.12);color:#e05555">✕ Afwijzen</button>' +
            '<button class="abtn" id="del" style="background:transparent;border:1px solid var(--border);color:var(--text-dim);margin-left:auto">Verwijderen</button>' +
          '</div>' +
        '</div></div>';
      document.body.appendChild(ov);
      const act = async (q) => {
        await fetch(API + '/recruit_list.php?token=' + encodeURIComponent(t.accessToken) + '&' + q).catch(() => {});
        ov.remove(); renderAdmin(t);
      };
      ov.querySelector('#acc').onclick = () => act('status=accepted&id=' + r.character_id);
      ov.querySelector('#rej').onclick = () => act('status=rejected&id=' + r.character_id);
      ov.querySelector('#del').onclick = () => { if (confirm('Aanmelding verwijderen?')) act('delete=' + r.character_id); };
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    (async () => {
      const url = new URLSearchParams(location.search);
      const code = url.get('code'), state = url.get('state');
      if (code && state) {
        try {
          const t = await exchange(code, state);
          localStorage.setItem(STORE_KEY, JSON.stringify(t));
          history.replaceState({}, '', REDIRECT_URI);  // ?code uit de URL halen
          renderLoggedIn(t);
        } catch (e) {
          history.replaceState({}, '', REDIRECT_URI);
          renderLogin(e.message || 'Login mislukt');
        }
        return;
      }
      const saved = localStorage.getItem(STORE_KEY);
      if (saved) { try { return renderLoggedIn(JSON.parse(saved)); } catch {} }
      renderLogin();
    })();
  </script>
</body>
</html>
